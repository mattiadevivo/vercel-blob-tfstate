name: Lint

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    oxlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              #with:
              #  version: "10.33.2" # not needed since packageManager field is set in package.json
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
